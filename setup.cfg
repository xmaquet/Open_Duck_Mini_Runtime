[metadata]
name = mini-bdx-runtime
version = 0.0.1
author = Antoine Pirrone
author_email = antoine.pirrone@gmail.com
url = https://github.com/xmaquet/Open_Duck_Mini_Runtime
description = Runtime code for mini BDX
long_description = file: README.md
long_description_content_type = text/markdown
python_requires = >=3.11,<3.14

[options]
packages = find:
zip_safe = True
include_package_data = True
package_dir=
    =mini_bdx_runtime
# Plages souples pour Pi / Python 3.11–3.13 ; avec venv --system-site-packages, les wheels
# lourds peuvent être évités si les paquets Debian fournissent déjà numpy/pygame/opencv.
install_requires =
    numpy>=2.2,<2.3
    scipy>=1.14,<1.16

[options.packages.find]
where=mini_bdx_runtime

[options.package_data]

[options.extras_require]
hardware =
    adafruit-circuitpython-bno055>=5.4.13,<6
    rustypot>=0.1.0
    pypot @ git+https://github.com/pollen-robotics/pypot@support-feetech-sts3215
audio =
    pygame>=2.6.1,<2.7
control =
    pygame>=2.6.1,<2.7
ai =
    openai>=1.70.0,<2
# Marche RL / inférence ONNX (onnx_infer, v2_rl_walk_mujoco) — volontairement hors install de base.
rl =
    onnxruntime>=1.24.4,<1.26
# Serveur GATT BlueZ (tablette Android → Pi), cf. mini_bdx_runtime.ble_gatt_server.
ble =
    # PyPI : dernière 0.1.x stable (pas de release 1.x à ce jour).
    bluez-peripheral>=0.1.7,<0.2

[options.entry_points]
console_scripts =
    bdx-xbox-controller = mini_bdx_runtime.xbox_controller:main
    bdx-xbox-bridge = mini_bdx_runtime.xbox_bridge:main
    bdx-ble-robot = mini_bdx_runtime.ble_gatt_server:main
